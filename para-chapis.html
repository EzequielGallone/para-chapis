<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Chapis</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: #fff8e7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Georgia', 'Times New Roman', serif;
    overflow: hidden;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    padding: 2rem;
  }

  svg { width: 260px; height: auto; }

  .stem {
    stroke: #4b7a3a;
    stroke-width: 5;
    stroke-linecap: round;
    fill: none;
    stroke-dasharray: 120;
    stroke-dashoffset: 120;
    animation: grow 1.2s ease-out forwards;
  }

  .leaf {
    fill: #5a9146;
    opacity: 0;
    animation: fadein 0.8s ease-out 0.9s forwards;
  }

  .petal {
    transform-origin: 110px 120px;
    opacity: 0;
    animation: bloom 0.9s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  .petal1 { animation-delay: 1.1s; }
  .petal2 { animation-delay: 1.25s; }
  .petal3 { animation-delay: 1.4s; }
  .petal4 { animation-delay: 1.55s; }
  .petal5 { animation-delay: 1.7s; }

  .center {
    opacity: 0;
    animation: fadein 0.6s ease-out 1.9s forwards;
  }

  @keyframes grow { to { stroke-dashoffset: 0; } }
  @keyframes fadein { to { opacity: 1; } }
  @keyframes bloom {
    0%   { opacity: 0; transform: scale(0.3) rotate(-15deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  #msg {
    font-size: 28px;
    color: #6b4f1d;
    text-align: center;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 1.2s ease, transform 1.2s ease;
  }

  @media (max-width: 480px) {
    svg { width: 200px; }
    #msg { font-size: 22px; padding: 0 1rem; }
  }
</style>
</head>
<body>

<div class="container">
  <svg viewBox="0 0 220 260" role="img" aria-label="Rosa amarilla animada">
    <path class="stem" d="M110 250 L110 140"/>
    <path class="leaf" d="M110 210 C90 205 75 220 80 235 C100 235 112 225 110 210 Z"/>
    <path class="leaf" d="M110 190 C130 185 145 200 140 215 C120 215 108 205 110 190 Z"/>
    <g class="petal petal1"><ellipse cx="90" cy="105" rx="26" ry="20" fill="#f4c430"/></g>
    <g class="petal petal2"><ellipse cx="130" cy="105" rx="26" ry="20" fill="#f7d038"/></g>
    <g class="petal petal3"><ellipse cx="110" cy="80" rx="24" ry="22" fill="#f9d84a"/></g>
    <g class="petal petal4"><ellipse cx="95" cy="125" rx="22" ry="18" fill="#e8b823"/></g>
    <g class="petal petal5"><ellipse cx="125" cy="125" rx="22" ry="18" fill="#eec02e"/></g>
    <g class="center"><ellipse cx="110" cy="108" rx="16" ry="14" fill="#d9a800"/></g>
  </svg>

  <div id="msg">Para Chapis, la más linda</div>
</div>

<script>
  setTimeout(function () {
    var m = document.getElementById('msg');
    m.style.opacity = '1';
    m.style.transform = 'translateY(0)';
  }, 2600);
</script>

</body>
</html>
